name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: locks/lint.txt

      # Ruff est installé depuis le verrou haché (pyproject.toml -> locks/lint.txt) : `ruff format --check`
      # dépend de la version, elle ne doit pas changer avec la date.
      - name: Install ruff (locked)
        run: pip install --require-hashes --no-deps -r locks/lint.txt

      - name: Run ruff check
        run: ruff check collegue tests

      - name: Run ruff format check
        run: ruff format --check collegue tests

  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: locks/dev.txt

      # pyproject.toml est la source unique ; locks/dev.txt (haché, universel 3.11/3.12) en est dérivé.
      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r locks/dev.txt

      - name: Verify locks match pyproject.toml
        run: python scripts/locks.py check

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
        run: pytest tests/ --maxfail=5 --cov=collegue --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: locks/audit.txt

      # pip-audit --strict audite tout l'environnement, pip/setuptools compris.
      # Le pip par défaut du runner traîne des CVE déjà corrigées en amont :
      # on l'upgrade d'abord pour ne pas bloquer sur des outils de build.
      - name: Upgrade pip toolchain
        run: python -m pip install --upgrade pip setuptools

      # Runtime + dashboard + pip-audit, verrouillés et hachés (locks/audit.txt).
      - name: Install audited dependencies (locked)
        run: pip install --require-hashes --no-deps -r locks/audit.txt

      # Source -> verrou : une dérive de pyproject.toml sans régénération échoue ici (hors ligne), puis
      # une résolution fraîche à la date de gel doit reproduire exactement les verrous commités.
      - name: Verify locks match pyproject.toml
        run: |
          pip install uv==0.9.28
          python scripts/locks.py check --recompile

      - name: Run pip-audit
        run: pip-audit --strict --desc

      # Wheel construit depuis les fichiers du dépôt, installé NON éditable dans un venv vierge avec le
      # verrou runtime, puis exécuté hors checkout (ressources, migrations jusqu'à head, serveur sans LLM).
      - name: Verify the built wheel in a clean environment
        run: python scripts/verify_wheel.py --lock runtime --report wheel-report.json

      - name: Upload wheel verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-report
          path: wheel-report.json
          if-no-files-found: warn

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/collegue/Dockerfile
          push: false
          load: true
          tags: collegue:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build OpenHands sandbox image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/sandbox/Dockerfile.openhands
          push: false
          load: true
          tags: collegue-sandbox-openhands:pr-check

      - name: Verify OpenHands Gemma 4 terminal contract
        run: |
          docker run --rm collegue-sandbox-openhands:pr-check \
            python -c "from openhands.tools.terminal.definition import TerminalAction; assert TerminalAction.model_validate({'commands': 'true'}).command == 'true'; assert TerminalAction.model_validate({'command': 'canonical', 'commands': 'ignored'}).command == 'canonical'"

      # Prouve que le service est PRÊT (santé + MCP initialize), pas seulement lancé :
      # attente bornée, échec si le conteneur sort ou reste indisponible, journaux
      # conservés, aucun réseau ni appel LLM (cf. scripts/ci_docker_smoke.sh).
      - name: Smoke test — container starts and serves
        timeout-minutes: 5
        run: bash scripts/ci_docker_smoke.sh collegue:ci

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-logs
          path: smoke-logs/
          if-no-files-found: warn
