name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: locks/lint.txt

      # Ruff est installé depuis le verrou haché (pyproject.toml -> locks/lint.txt) : `ruff format --check`
      # dépend de la version, elle ne doit pas changer avec la date.
      - name: Install ruff (locked)
        run: pip install --require-hashes --no-deps -r locks/lint.txt

      - name: Run ruff check
        run: ruff check collegue tests

      - name: Run ruff format check
        run: ruff format --check collegue tests

  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # Service PostgreSQL ÉPHÉMÈRE du job (détruit avec lui) : la preuve de réservations concurrentes du registre de
    # budget exige un vrai PostgreSQL, pas un mock. Le mot de passe est celui du service jetable, pas un secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COLLEGUE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: locks/dev.txt

      # pyproject.toml est la source unique ; locks/dev.txt (haché, universel 3.11/3.12) en est dérivé.
      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r locks/dev.txt

      - name: Verify locks match pyproject.toml
        run: python scripts/locks.py check

      # Preuve PostgreSQL RÉELLE, dans ce job requis : un échec, un test sauté ou désélectionné, une collecte
      # tronquée ou un service absent rendent le job rouge (le rapport JUnit doit couvrir tout ce qui est collecté).
      # Le plancher (21) est un minimum : à relever si des cas sont ajoutés, jamais à abaisser pour masquer une perte.
      - name: PostgreSQL budget ledger - real concurrency proof
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          test -n "${COLLEGUE_TEST_POSTGRES_URL:-}"
          # -o addopts= : mêmes options pour la collecte et l'exécution (le « -q » du pyproject masquerait les identifiants,
          # et aucun marqueur ne doit pouvoir désélectionner cette preuve).
          expected="$(pytest tests/test_budget_ledger_postgres.py -o addopts= --collect-only -q -p no:cacheprovider | grep -c '::')"
          echo "tests PostgreSQL collectés: ${expected}"
          pytest tests/test_budget_ledger_postgres.py -o addopts= -p no:cacheprovider -rA --junitxml=pg-budget.xml
          python scripts/ci_require_junit.py pg-budget.xml --min-tests 21 --expect-tests "${expected}"

      # Vague 3 : mêmes garanties pour l'état durable de fusion (task_merges : CAS, contraintes, courses d'insertion,
      # réouverture) et pour la persistance des preuves de livraison (journal de décisions, relecture, concurrence).
      # Planchers = nombre exact de tests de chaque fichier ; à relever si des cas sont ajoutés, jamais à abaisser.
      - name: PostgreSQL task merges - real durable-state proof
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          test -n "${COLLEGUE_TEST_POSTGRES_URL:-}"
          expected="$(pytest tests/test_task_merge_postgres.py -o addopts= --collect-only -q -p no:cacheprovider | grep -c '::')"
          echo "tests PostgreSQL collectés: ${expected}"
          pytest tests/test_task_merge_postgres.py -o addopts= -p no:cacheprovider -rA --junitxml=pg-task-merges.xml
          python scripts/ci_require_junit.py pg-task-merges.xml --min-tests 23 --expect-tests "${expected}"

      - name: PostgreSQL delivery proofs - real persistence proof
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          test -n "${COLLEGUE_TEST_POSTGRES_URL:-}"
          expected="$(pytest tests/test_delivery_proof_postgres.py -o addopts= --collect-only -q -p no:cacheprovider | grep -c '::')"
          echo "tests PostgreSQL collectés: ${expected}"
          pytest tests/test_delivery_proof_postgres.py -o addopts= -p no:cacheprovider -rA --junitxml=pg-delivery-proofs.xml
          python scripts/ci_require_junit.py pg-delivery-proofs.xml --min-tests 5 --expect-tests "${expected}"

      # Vague 5 : état durable du courtier budgétaire (sessions, tentatives, horloge persistée, migration 0012 → 0013), rejoué sur un
      # VRAI PostgreSQL avec les mêmes scénarios que SQLite. Le fichier doit exister (``test -f`` : son absence rend le job rouge,
      # jamais un pas sauté). Le plancher (76) est le nombre collecté sur le SHA `d5800a8` de A : C le recale sur le nombre exact collecté à l'intégration de A
      # (checklist de docs/consolidation/w5-integration.md), puis il ne baisse plus.
      - name: PostgreSQL broker state - real durable-state proof
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          test -n "${COLLEGUE_TEST_POSTGRES_URL:-}"
          test -f tests/test_w5_broker_postgres.py
          expected="$(pytest tests/test_w5_broker_postgres.py -o addopts= --collect-only -q -p no:cacheprovider | grep -c '::')"
          echo "tests PostgreSQL collectés: ${expected}"
          pytest tests/test_w5_broker_postgres.py -o addopts= -p no:cacheprovider -rA --junitxml=pg-broker.xml
          python scripts/ci_require_junit.py pg-broker.xml --min-tests 76 --expect-tests "${expected}"

      - name: Upload PostgreSQL proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-budget-junit-${{ matrix.python-version }}
          path: |
            pg-budget.xml
            pg-task-merges.xml
            pg-delivery-proofs.xml
            pg-broker.xml
          if-no-files-found: warn

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
        run: pytest tests/ --maxfail=5 --cov=collegue --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: locks/audit.txt

      # pip-audit --strict audite tout l'environnement, pip/setuptools compris.
      # Le pip par défaut du runner traîne des CVE déjà corrigées en amont :
      # on l'upgrade d'abord pour ne pas bloquer sur des outils de build.
      - name: Upgrade pip toolchain
        run: python -m pip install --upgrade pip setuptools

      # Runtime + dashboard + pip-audit, verrouillés et hachés (locks/audit.txt).
      - name: Install audited dependencies (locked)
        run: pip install --require-hashes --no-deps -r locks/audit.txt

      # Source -> verrou : une dérive de pyproject.toml sans régénération échoue ici (hors ligne), puis
      # une résolution fraîche à la date de gel doit reproduire exactement les verrous commités.
      # uv est épinglé À LA VERSION EXACTE de scripts/locks.py (UV_VERSION) : pip-audit audite ensuite cet
      # environnement, uv compris (0.9.28 était affecté par GHSA-pjjw-68hj-v9mw et GHSA-4gg8-gxpx-9rph).
      - name: Verify locks match pyproject.toml
        run: |
          pip install uv==0.11.33
          python scripts/locks.py check --recompile

      - name: Run pip-audit
        run: pip-audit --strict --desc

      # Audit EXPLICITE des dépendances de test/développement verrouillées (locks/dev.txt, pypdf compris),
      # qui n'étaient auditées par aucun job : l'audit ci-dessus ne voit que l'environnement installé
      # (locks/audit.txt). Aucune fermeture dev n'est réinstallée : le fichier est lu et chaque version
      # épinglée est interrogée telle quelle (--no-deps : la fermeture est déjà dans le verrou ;
      # --disable-pip : pas de résolution). Toute erreur échoue le job (--strict) et AUCUN avis n'est ignoré.
      # PORTÉE RÉELLE : pip-audit évalue les marqueurs d'environnement du verrou contre l'interpréteur de ce
      # job (Python 3.12, Linux). Les entrées réservées à Python < 3.12 (backports-tarfile,
      # importlib-metadata, zipp) ne sont donc PAS auditées ici ; ce n'est pas un audit de la fermeture 3.11.
      - name: Audit locked dev dependencies (strict)
        run: pip-audit --strict --desc --no-deps --disable-pip -r locks/dev.txt

      # Vague 5 : verrou de l'image du transport broker (docker/sandbox/Dockerfile.broker) et verrou de la pile métier approuvée
      # (copié dans le socle de la fixture) : même méthode, AUCUN avis ignoré. Ces deux verrous sont résolus pour Python 3.12 ; les entrées
      # réservées à une autre plate-forme (marqueurs ``sys_platform``) ne sont pas évaluées sur ce runner Linux. L'ancien verrou
      # locks/sandbox-openhands.txt (image « direct » historique) N'est PAS audité ici : son audit strict est rouge (voir
      # docs/consolidation/w5-integration.md) et il n'est pas utilisé par la campagne W5.
      - name: Audit locked broker image dependencies (strict)
        run: pip-audit --strict --desc --no-deps --disable-pip -r locks/sandbox-broker.txt

      - name: Audit locked approved fixture stack (strict)
        run: pip-audit --strict --desc --no-deps --disable-pip -r locks/fixture-stack.txt

      # Wheel construit depuis les fichiers du dépôt, installé NON éditable dans un venv vierge avec le
      # verrou runtime, puis exécuté hors checkout (ressources, migrations jusqu'à head, serveur sans LLM).
      - name: Verify the built wheel in a clean environment
        run: python scripts/verify_wheel.py --lock runtime --report wheel-report.json

      - name: Upload wheel verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-report
          path: wheel-report.json
          if-no-files-found: warn

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/collegue/Dockerfile
          push: false
          load: true
          tags: collegue:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build OpenHands sandbox image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/sandbox/Dockerfile.openhands
          push: false
          load: true
          tags: collegue-sandbox-openhands:pr-check

      - name: Verify OpenHands Gemma 4 terminal contract
        run: |
          docker run --rm collegue-sandbox-openhands:pr-check \
            python -c "from openhands.tools.terminal.definition import TerminalAction; assert TerminalAction.model_validate({'commands': 'true'}).command == 'true'; assert TerminalAction.model_validate({'command': 'canonical', 'commands': 'ignored'}).command == 'canonical'"

      # Contrôle SANS MODÈLE du VRAI SDK OpenHands de l'image et du runner embarqué /opt/oh_runner.py :
      # les arguments utilisés existent dans LLM.model_fields ET un vrai LLM est construit (identifiants
      # FACTICES, définis par le script) pour Gemini par défaut, OpenAI à endpoint propre, fournisseur local
      # sans clé et replis (modèle, base_url, clé effective). Conteneur SANS réseau, AUCUN secret ni
      # variable d'hôte, script transmis sur l'entrée standard (aucun montage). Il vérifie aussi que pypdf est
      # importable dans l'image du worker ; cela ne prouve PAS que le gate exécute ses oracles dans cette image.
      # Identité : sur CHAQUE vrai LLM construit (primaire, replis, abonnement, échantillonneur) on asserte usage_id (« coder » /
      # « sampler » ; le SDK ignore silencieusement un argument inconnu comme l'ancien service_id). Abonnement : vraie
      # OpenAISubscriptionAuth.create_llm avec credentials FACTICES (aucun login, aucune connexion), max_output_tokens None.
      - name: Verify OpenHands worker routing (real SDK, no model)
        timeout-minutes: 5
        run: |
          docker run --rm -i --network none \
            collegue-sandbox-openhands:pr-check \
            python - < scripts/ci_w4_worker_routing.py

      # Image du transport BROKER (W5) : SDK/outils seuls, pile métier approuvée, verrou audité (docker/sandbox/Dockerfile.broker).
      - name: Build OpenHands broker sandbox image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/sandbox/Dockerfile.broker
          push: false
          load: true
          tags: collegue-sandbox-broker:pr-check

      - name: Verify the broker image Gemma 4 terminal contract (sdk-only)
        run: |
          docker run --rm --network none collegue-sandbox-broker:pr-check \
            python -c "from openhands.tools.terminal.definition import TerminalAction; assert TerminalAction.model_validate({'commands': 'true'}).command == 'true'; assert TerminalAction.model_validate({'command': 'canonical', 'commands': 'ignored'}).command == 'canonical'"

      - name: Verify OpenHands worker routing in the broker image (real SDK, no model)
        timeout-minutes: 5
        run: |
          docker run --rm -i --network none \
            collegue-sandbox-broker:pr-check \
            python - < scripts/ci_w4_worker_routing.py

      # Transport W5 SANS MODÈLE ni clé : le VRAI SDK OpenHands de l'image appelle le relais embarqué /opt/oh_broker_relay.py, qui recopie
      # vers un socket Unix tenu par un FAUX courtier (route OpenAI, jeton de session factice, usage). Conteneur SANS réseau, aucun
      # secret ni variable d'hôte, script transmis sur l'entrée standard (aucun montage). Le script prouve aussi l'isolation (seule la
      # boucle locale, aucune connexion externe, aucune variable ressemblant à une clé) et que le relais n'est pas un proxy (autre
      # route ou URL absolue → 404, corps au-delà du plafond coupé). Le VRAI courtier, ses budgets et son fournisseur sont éprouvés par
      # les tests de A et la preuve d'intégration hôte ; aucun fournisseur réel n'est joint ici.
      - name: Verify OpenHands broker transport (real SDK, fake broker, network none)
        timeout-minutes: 5
        run: |
          docker run --rm -i --network none \
            collegue-sandbox-broker:pr-check \
            python - < scripts/ci_w5_broker_transport.py

      # Preuve du VRAI vérificateur métier public (collegue.pilot.w4_business.verify_business_checkout, runner omis) dans
      # l'image CONSTRUITE ci-dessus, sans modèle, sans clé et sans réseau applicatif (les conteneurs sont lancés par B en
      # --network none). L'orchestrateur tourne sur l'hôte avec les dépendances de test VERROUILLÉES et hachées (locks/dev.txt) ;
      # il ne construit aucun montage et n'exécute aucun livrable sur l'hôte. Trois cas obligatoires : la fixture de référence
      # (observation passed, toutes les assertions métier vraies), puis deux témoins hostiles qui neutralisent SIGALRM (et SIGTERM)
      # et que le superviseur EXTERNE du conteneur doit arrêter (codes 124 puis 137) en un temps borné. Un cas non exécuté,
      # une image absente ou un import manquant font échouer le job. La relève hôte est allongée pendant les témoins pour isoler
      # le superviseur ; ni la marge de production de 2 s ni un crash réel de l'hôte ne sont éprouvés ici.
      - name: Set up Python 3.12 for the verifier proof
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: locks/dev.txt

      - name: Install locked test dependencies for the verifier proof
        run: pip install --require-hashes --no-deps -r locks/dev.txt

      - name: Prove the business verifier in the built image (public path, no model)
        timeout-minutes: 10
        run: python scripts/ci_w4_business_verifier.py --image collegue-sandbox-openhands:pr-check --report-dir w4-verifier-report

      - name: Upload business verifier proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w4-business-verifier-proof
          path: w4-verifier-report/
          if-no-files-found: warn

      # Même preuve dans l'image que la campagne W5 utilise réellement (transport broker).
      - name: Prove the business verifier in the broker image (public path, no model)
        timeout-minutes: 10
        run: python scripts/ci_w4_business_verifier.py --image collegue-sandbox-broker:pr-check --report-dir w5-broker-verifier-report

      # PREUVE COMPOSÉE W5 en conteneur réel (tests/test_w5_integration_image.py, marqueur w5_image) : le VRAI SDK / oh_runner / relais de l'image
      # broker, lancés par le VRAI DockerSandbox (--network none, un seul montage en lecture seule), traversent le VRAI BrokerSocketServer +
      # BrokerService + registre SQLite de l'hôte, avec un FAUX fournisseur Google derrière qui observe countTokens / generateContent. Elle prouve
      # aussi : code hostile appelant le socket (modèle / URL / session / champs non autorisés, aucun accès Internet, aucune clé), et un worker qui
      # dort ou calcule SANS nouvel appel est tué à l'échéance persistée commune, conteneur absent ensuite, réservation en vol conservée si usage inconnu.
      # Ces tests sont exclus de la suite générale (addopts) et SÉLECTIONNÉS ici : collectés et exécutés sans saut (ci_require_junit refuse un test
      # sauté, désélectionné, manquant ou une collecte tronquée) ; Docker ou image absents = échec. L'usage vient du registre, jamais du stdout du worker.
      - name: Prove the real SDK through the real broker service (fake Google, hostile code, persisted deadline)
        timeout-minutes: 20
        env:
          PYTHONPATH: .:tests
          W5_BROKER_IMAGE: collegue-sandbox-broker:pr-check
        run: |
          set -euo pipefail
          expected="$(pytest tests/test_w5_integration_image.py -o addopts= -m w5_image --collect-only -q -p no:cacheprovider | grep -c '::')"
          echo "tests de la preuve composée collectés: ${expected}"
          pytest tests/test_w5_integration_image.py -o addopts= -m w5_image -p no:cacheprovider -rA --junitxml=w5-image-proof.xml
          python scripts/ci_require_junit.py w5-image-proof.xml --min-tests 7 --expect-tests "${expected}"

      - name: Upload the composed proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w5-image-composed-proof
          path: w5-image-proof.xml
          if-no-files-found: warn

      - name: Upload broker image business verifier proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w5-broker-business-verifier-proof
          path: w5-broker-verifier-report/
          if-no-files-found: warn

      # Prouve que le service est PRÊT (santé + MCP initialize), pas seulement lancé :
      # attente bornée, échec si le conteneur sort ou reste indisponible, journaux
      # conservés, aucun réseau ni appel LLM (cf. scripts/ci_docker_smoke.sh).
      - name: Smoke test — container starts and serves
        timeout-minutes: 5
        run: bash scripts/ci_docker_smoke.sh collegue:ci

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-logs
          path: smoke-logs/
          if-no-files-found: warn
