# Publication des ports sur l'HÔTE
# --------------------------------
# Profil local par défaut : tous les ports sont publiés sur le LOOPBACK (127.0.0.1) via
# COLLEGUE_PUBLISH_HOST. Le serveur MCP n'a pas d'authentification tant que OAUTH_ENABLED
# est false : il ne doit pas être joignable depuis le réseau par simple `docker compose up`.
#
# Les conteneurs continuent d'écouter sur 0.0.0.0 EN INTERNE (MCP_HOST, entrypoint.sh,
# --server.address) : c'est nécessaire pour que le mapping de ports Docker fonctionne ; seule
# la publication hôte est restreinte.
#
# Exposition distante : ACTE EXPLICITE. Définir COLLEGUE_PUBLISH_HOST=0.0.0.0 (ou l'IP d'une
# interface précise) dans .env, ET activer OAuth (OAUTH_ENABLED=true + OAUTH_JWKS_URI/OAUTH_PUBLIC_KEY
# + OAUTH_ISSUER). Avec OAUTH_ENABLED=true, un OAuth inutilisable interdit le démarrage
# (jamais de repli silencieux sans auth). Un reverse proxy TLS reste recommandé devant.
services:
  collegue-app:
    build:
      context: .
      dockerfile: docker/collegue/Dockerfile
    image: collegue-app:latest
    restart: always
    # Exposer directement le port MCP pour contourner Traefik (version incompatible)
    ports:
      - "${COLLEGUE_PUBLISH_HOST:-127.0.0.1}:4121:4121"
      - "${COLLEGUE_PUBLISH_HOST:-127.0.0.1}:4122:4122"
    environment:
      PYTHONUNBUFFERED: 1
      PORT: 4121
      MCP_TRANSPORT: http
      # Écoute INTERNE au conteneur ; la publication hôte est régie par COLLEGUE_PUBLISH_HOST.
      MCP_HOST: 0.0.0.0
      # Transmis à l'application pour qu'elle avertisse d'une exposition distante sans OAuth.
      COLLEGUE_PUBLISH_HOST: ${COLLEGUE_PUBLISH_HOST:-127.0.0.1}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    env_file:
      - .env
    # Store partagé avec le dashboard ; sans ce volume commun, ses onglets restent vides.
    volumes:
      - collegue_data:/app/.collegue
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4122/_health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  collegue-dashboard:
    build:
      context: .
      dockerfile: docker/collegue/Dockerfile
    image: collegue-app:latest
    restart: always
    ports:
      - "${COLLEGUE_PUBLISH_HOST:-127.0.0.1}:4125:4125"
    environment:
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    # Même volume que collegue-app : lit les stores écrits par le serveur MCP.
    volumes:
      - collegue_data:/app/.collegue
    command: ["streamlit", "run", "collegue/dashboard/app.py", "--server.port=4125", "--server.address=0.0.0.0", "--server.headless=true"]
    depends_on:
      collegue-app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    env_file:
      - .env
    ports:
      - "${COLLEGUE_PUBLISH_HOST:-127.0.0.1}:4123:8080"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: always
    ports:
      - "${COLLEGUE_PUBLISH_HOST:-127.0.0.1}:8088:80"
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      collegue-app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Image d'exécution du sandbox isolé (C8). Sous le profil "sandbox" : NON
  # démarrée par `docker compose up` — l'exécuteur (collegue/sandbox/executor.py)
  # lance des conteneurs éphémères à la demande via `docker run`. Cette entrée sert
  # à builder l'image : `docker compose --profile sandbox build collegue-sandbox`.
  collegue-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    image: collegue-sandbox:latest
    profiles:
      - sandbox
    # Conteneur de référence sans rôle de service long-running.
    restart: "no"
    command: ["python", "--version"]

volumes:
  nginx_logs:
  collegue_data:
