# Publication des ports sur l'HÔTE
# --------------------------------
# Profil local par défaut : TOUTES les publications hôte (4121, 4122, 4123, 4125, 8088) sont
# liées au LOOPBACK (127.0.0.1). Sans OAuth (OAUTH_ENABLED=false) le serveur MCP n'a aucune
# authentification : il ne doit pas être joignable depuis le réseau par simple `docker compose up`.
#
# Les conteneurs continuent d'écouter sur 0.0.0.0 EN INTERNE (MCP_HOST, entrypoint.sh,
# --server.address) : c'est nécessaire au mapping de ports Docker et au réseau Compose ; seule
# la publication hôte est restreinte.
#
# Trois variables INDÉPENDANTES (défaut 127.0.0.1), pour n'ouvrir que ce qui est voulu :
#   COLLEGUE_PUBLISH_HOST            surface MCP : 4121 (MCP), 4122 (health, well-known OAuth),
#                                    8088 (nginx : proxifie uniquement /mcp/, /_health, /.well-known/)
#   COLLEGUE_DASHBOARD_PUBLISH_HOST  4125 (dashboard Streamlit : AUCUNE authentification)
#   COLLEGUE_KEYCLOAK_PUBLISH_HOST   4123 (Keycloak en start-dev : ne pas exposer tel quel)
# Exposer le MCP n'ouvre donc jamais le dashboard ni Keycloak.
#
# Demander une exposition distante du MCP, AVEC OAuth (dans .env) :
#   COLLEGUE_PUBLISH_HOST=0.0.0.0        # ou l'IP d'une interface précise
#   OAUTH_ENABLED=true
#   OAUTH_ISSUER=https://idp.example.com/realms/collegue
#   OAUTH_JWKS_URI=https://idp.example.com/realms/collegue/protocol/openid-connect/certs
#   OAUTH_AUDIENCE=collegue              # facultatif
# Avec OAUTH_ENABLED=true, un OAuth inutilisable (JWTVerifier absent, constructeur en erreur,
# ni OAUTH_JWKS_URI ni OAUTH_PUBLIC_KEY, OAUTH_ISSUER vide) fait SORTIR le conteneur en code
# non nul : jamais de repli silencieux sans auth. Vérifier ensuite : `docker compose config`
# (host_ip) puis une requête MCP sans jeton doit répondre 401. Un reverse proxy TLS reste
# recommandé devant le service.
services:
  collegue-app:
    build:
      context: .
      dockerfile: docker/collegue/Dockerfile
    image: collegue-app:latest
    restart: always
    # Exposer directement le port MCP pour contourner Traefik (version incompatible)
    ports:
      - "${COLLEGUE_PUBLISH_HOST:-127.0.0.1}:4121:4121"
      - "${COLLEGUE_PUBLISH_HOST:-127.0.0.1}:4122:4122"
    environment:
      PYTHONUNBUFFERED: 1
      PORT: 4121
      MCP_TRANSPORT: http
      # Écoute INTERNE au conteneur ; la publication hôte est régie par COLLEGUE_PUBLISH_HOST.
      MCP_HOST: 0.0.0.0
      # Transmis à l'application pour qu'elle avertisse d'une exposition distante sans OAuth.
      COLLEGUE_PUBLISH_HOST: ${COLLEGUE_PUBLISH_HOST:-127.0.0.1}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    env_file:
      - .env
    # Store partagé avec le dashboard ; sans ce volume commun, ses onglets restent vides.
    volumes:
      - collegue_data:/app/.collegue
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    healthcheck:
      # Sain = health server (4122) ET serveur MCP (4121) à l'écoute : le health server seul ne
      # suffit pas. `mcp-ready` (entrypoint.sh) applique le critère de l'attente de démarrage.
      test: ["CMD-SHELL", "curl -f http://localhost:4122/_health >/dev/null && ./entrypoint.sh mcp-ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  collegue-dashboard:
    build:
      context: .
      dockerfile: docker/collegue/Dockerfile
    image: collegue-app:latest
    restart: always
    ports:
      - "${COLLEGUE_DASHBOARD_PUBLISH_HOST:-127.0.0.1}:4125:4125"
    environment:
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    # Même volume que collegue-app : lit les stores écrits par le serveur MCP.
    volumes:
      - collegue_data:/app/.collegue
    command: ["streamlit", "run", "collegue/dashboard/app.py", "--server.port=4125", "--server.address=0.0.0.0", "--server.headless=true"]
    depends_on:
      collegue-app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    env_file:
      - .env
    ports:
      - "${COLLEGUE_KEYCLOAK_PUBLISH_HOST:-127.0.0.1}:4123:8080"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: always
    ports:
      - "${COLLEGUE_PUBLISH_HOST:-127.0.0.1}:8088:80"
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      collegue-app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Image d'exécution du sandbox isolé (C8). Sous le profil "sandbox" : NON
  # démarrée par `docker compose up` — l'exécuteur (collegue/sandbox/executor.py)
  # lance des conteneurs éphémères à la demande via `docker run`. Cette entrée sert
  # à builder l'image : `docker compose --profile sandbox build collegue-sandbox`.
  collegue-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    image: collegue-sandbox:latest
    profiles:
      - sandbox
    # Conteneur de référence sans rôle de service long-running.
    restart: "no"
    command: ["python", "--version"]

volumes:
  nginx_logs:
  collegue_data:
